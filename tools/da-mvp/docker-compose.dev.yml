# Local dev stack: source CH, target CH, anvil. Not a production rig.
services:
  source-ch:
    image: clickhouse/clickhouse-server:24.8
    container_name: damvp-source-ch
    ports: ["19000:9000", "18123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes: [ "source-ch-data:/var/lib/clickhouse" ]
  target-ch:
    image: clickhouse/clickhouse-server:24.8
    container_name: damvp-target-ch
    ports: ["29000:9000", "28123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes: [ "target-ch-data:/var/lib/clickhouse" ]
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: damvp-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "1"]
    ports: ["8545:8545"]
volumes:
  source-ch-data:
  target-ch-data:
