# gitleaks config for housegate.
#
# Extends the upstream default ruleset and allowlists the handful of
# committed test fixtures so the pre-commit hook (scripts/git-hooks/pre-commit)
# isn't drowned in false positives.
#
# Editing rule: every entry below is a hole — keep the list minimal,
# prefer path allowlists over regex allowlists, and document why.

title = "housegate gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Committed local-dev fixtures with throwaway secp256k1 keys"
# Local-dev YAML configs ship with disposable secp256k1 keys so the
# proxy binary boots out-of-the-box. Anyone who treats them as live
# credentials is doing something deeply wrong; rotate via
# scripts/setup-local-test-key.sh if a leak is suspected.
paths = [
    '''^configs/local\..*\.yaml$''',
]

[[allowlists]]
description = "Test code with obvious-fake keys"
# proxy_test.go and the cmd-library-mode design doc both use the
# alphabetically-sequential 0x0123...cdef sentinel as a stand-in for a
# real private key. Pattern is unmistakable but matches the
# eth-private-key shape.
paths = [
    '''^proxy_test\.go$''',
    '''^docs/superpowers/.*\.md$''',
]
regexes = [
    '''0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
    # Zero-fill placeholders left by the 2026-04-29 git-filter-repo
    # scrub of historical pre-rotation keys. 40-hex addr or 64-hex priv.
    '''0x0{40,64}''',
]

[[allowlists]]
description = "Anvil's documented deterministic account 0 key"
# Foundry's anvil ships a fixed deterministic mnemonic; account 0's
# private key is published in foundry's own docs and is used here
# only to drive local-dev / integration tests against an anvil node.
# Treating this as a leak is a false positive.
paths = [
    '''^tools/da-mvp/scripts/deploy-anchor\.sh$''',
    '''^tools/da-mvp/pkg/anchor/integration_test\.go$''',
    '''^tools/da-mvp/cmd/da-rebuilder/main\.go$''',
    '''^tools/da-mvp/scripts/run-experiment-a\.sh$''',
    '''^tools/da-mvp/scripts/run-experiment-b\.sh$''',
    '''^tools/da-mvp/scripts/run-experiment-c\.sh$''',
]
regexes = [
    '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
]

[[allowlists]]
description = "Deterministic statement-v2 interoperability vectors"
# The committed cross-repo fixture intentionally contains compact JWS tokens
# plus the repeated-a throwaway key used to regenerate them. It is consumed by
# both Housegate and Arbiter tests and is never accepted by production config.
paths = [
    '''^pkg/auth/testdata/statement_jws_v2\.json$''',
]
