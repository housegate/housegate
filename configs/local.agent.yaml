# Local agent-mode config.
#
# Run an agent next to a CH client; every Query gets a JWS injected,
# then the packet stream is forwarded to a server-mode housegate
# (configs/local.yaml listens on :10001 by default).
#
# Provide the signing key via env var (do NOT commit a real key here):
#   export HOUSEGATE_AGENT_KEY=0xYOUR_PRIVATE_KEY_HEX
#   ./housegate -config ./configs/local.agent.yaml
#
# HOUSEGATE_AGENT_KEY / HOUSEGATE_AGENT_UPSTREAM / HOUSEGATE_AGENT=true override the
# corresponding fields below at startup.

listen: "0.0.0.0:10003"
metrics_listen: "0.0.0.0:10093"
dial_timeout: "5s"
idle_timeout: "5m"
shutdown_timeout: "30s"
stats_interval: "10s"
max_connection_lifetime: "24h"
streaming_buf_size: 131072
validate_checksum: false

agent:
  mode: true
  private_key_hex: "0x03bef7ad0f263e542a6bc04ba07ca41a958e5ed6e44a504deaec98aebf04d8b2"

network_state:
  source: "./configs/local.network_state.yaml"

logging:
  queries: true
  data: false
  max_query_bytes: 300
  max_data_bytes: 200
