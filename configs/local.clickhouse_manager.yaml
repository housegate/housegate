pick_lb_strategy: "hash"

roles:
  admin: &admin_role
    username: default
    password: password
  empty_viewer: &empty_role
    username: default
    password: password
  default_viewer: &default_role
    username: default
    password: password
  small_viewer: &small_role
    username: default
    password: password
  medium_viewer: &medium_role
    username: default
    password: password
  large_viewer: &large_role
    username: default
    password: password
  ultra_viewer: &ultra_role
    username: default
    password: password

credential:
  sentio: { <<: [*admin_role] }
  sentio_viewer: { <<: [*empty_role] }
  sentio_default_viewer: { <<: [*default_role] }
  sentio_small_viewer: { <<: [*small_role] }
  sentio_medium_viewer: { <<: [*medium_role] }
  sentio_large_viewer: { <<: [*large_role] }
  sentio_ultra_viewer: { <<: [*ultra_role] }
  subgraph: { <<: [*admin_role] }
  subgraph_viewer: { <<: [*empty_role] }
  subgraph_default_viewer: { <<: [*default_role] }
  subgraph_small_viewer: { <<: [*small_role] }
  subgraph_medium_viewer: { <<: [*medium_role] }
  subgraph_large_viewer: { <<: [*large_role] }
  subgraph_ultra_viewer: { <<: [*ultra_role] }

settings:
  max_memory_usage: 40000000000
  max_bytes_before_external_group_by: 20000000000
  max_execution_time: 300
  timeout_before_checking_execution_speed: 60
  min_execution_speed: 100000
  max_bytes_to_sort: 2000000000
  use_query_cache: 1
  query_cache_system_table_handling: 'ignore'
  query_cache_nondeterministic_function_handling: 'ignore'

shards:

  - index: 0
    name: 'local-0'
    allow_tiers: [0,1,2,3,16]
    allow_projects: []
    allow_organizations: []
    addresses:
      # new fields, please use them instead of deprecated fields
      internal_tcp_addr: localhost:9000
      internal_tcp_replicas: localhost:9000,localhost:9011
      internal_tcp_proxy: localhost:10001
      ## external same as internal, no cross cluster traffic
      external_tcp_addr: localhost:9000
      external_tcp_replicas: localhost:9000,localhost:9011
      external_tcp_proxy: localhost:10001