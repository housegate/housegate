name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@6ecf4fd8b7d1f9721785f1dd656a689acf9add47 # v3
      - name: Test Homebrew formula updater
        run: bazel test //:homebrew_formula_updater_test --test_output=errors

  build:
    name: Build
    # Self-hosted runners must never execute code from forked PRs — a
    # malicious fork could exfiltrate cached credentials or pivot into
    # the runner's network. Skip the job entirely when the PR's head
    # repo is not this repo. `push` events from main are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: bazelbuild/setup-bazelisk@v3
      # - name: Mount bazel cache
      #   uses: actions/cache@v4
      #   with:
      #     path: "~/.cache/bazel-disk"
      #     key: bazel

      - name: Build All
        run: bazel build //...

      # - name: Build & Test All
      #   run: bazel test --config=ci //...

  integration:
    name: Integration (ClickHouse)
    # Same fork-safety gate as the build job: integration tests run real
    # ClickHouse containers on the self-hosted runner, so fork code must
    # not reach this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: bazelbuild/setup-bazelisk@v3

      # Pre-pull the ClickHouse image so the first test does not spend
      # its testcontainers startup budget on a ~1GB pull. Idempotent —
      # docker skips if the image is already local. The ryuk image used
      # by testcontainers for cleanup is small (~10MB) and pulled
      # automatically on first run.
      - name: Pre-pull ClickHouse image
        run: docker pull clickhouse/clickhouse-server:25.8

      # Install the clickhouse fat binary for CLI integration tests.
      # ClickHouseCLI(t) probes tests/bin/clickhouse and t.Skip's when
      # missing, so this step is what makes the CLI cases actually run
      # in CI. Idempotent: install.sh writes a new binary in cwd each
      # time, but the test only cares that one exists at the path.
      - name: Install clickhouse client binary
        run: |
          mkdir -p tests/bin
          if [ ! -x tests/bin/clickhouse ]; then
            curl -sSL https://clickhouse.com/install.sh | sh
            mv clickhouse tests/bin/
          fi
          tests/bin/clickhouse --version

      - name: Fetch rewriter FFI lib
        shell: bash
        run: |
          set -euo pipefail
          ffi_path="$(bazel run //cmd:housegate -- fetch-rewriter-lib --tag v0.7.1 | tail -n 1)"
          test -n "$ffi_path"
          test -s "$ffi_path"
          echo "POLYGLOT_SQL_FFI_PATH=$ffi_path" >> "$GITHUB_ENV"

      # Integration targets are tagged `manual` so plain `bazel test //...`
      # leaves them alone (docker-less environments would fail). Listing
      # them explicitly bypasses the manual filter; expand this list when
      # adding new docker-bound integration targets.
      - name: Integration Tests
        run: |
          bazel test \
            //pkg/integration:integration_test \
            //pkg/integration/testenv:testenv_test \
            --test_env=POLYGLOT_SQL_FFI_PATH \
            --test_output=errors
